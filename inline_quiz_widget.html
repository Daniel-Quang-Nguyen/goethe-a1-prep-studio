<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background-color: #f7f6f2;
      color: #1f1d1a;
    }
    .font-editorial {
      font-family: 'Newsreader', Georgia, serif;
    }
  
    body.dark {
      background-color: #141312 !important;
      color: #f5f4f0 !important;
    }
    body.dark .bg-white {
      background-color: #1c1b18 !important;
      border-color: #2b2825 !important;
      color: #f5f4f0 !important;
    }
    body.dark .bg-\[\#f7f6f2\] {
      background-color: #141312 !important;
    }
    body.dark .bg-\[\#faf9f5\] {
      background-color: #24221f !important;
      color: #f5f4f0 !important;
    }
    body.dark .border-\[\#e7e4dc\],
    body.dark .border-\[\#f0ede6\] {
      border-color: #2e2b27 !important;
    }
    body.dark .text-\[\#1f1d1a\] {
      color: #f5f4f0 !important;
    }
    body.dark .text-\[\#524b45\],
    body.dark .text-\[\#736b63\],
    body.dark .text-\[\#3d3833\] {
      color: #d6d3cd !important;
    }
    body.dark .text-\[\#8c827a\] {
      color: #9c9589 !important;
    }
    body.dark .bg-\[\#433428\] {
      background-color: #c48b59 !important;
      color: #141312 !important;
    }
    body.dark .bg-\[\#433428\] span {
      color: #141312 !important;
    }
    body.dark .bg-\[\#f5f2eb\] {
      background-color: #2a2723 !important;
      border-color: #3d3833 !important;
      color: #e5c29f !important;
    }

  </style>
</head>
<body class="dark p-4 sm:p-6 antialiased text-sm text-[#1f1d1a]">
  <div class="max-w-2xl mx-auto space-y-4">
    
    <!-- Top Studio Header -->
    <div class="flex items-center justify-between pb-3 border-b border-[#e7e4dc]">
      <div class="flex items-center gap-3">
        <div class="w-7 h-7 rounded-lg text-xs bg-[#433428] text-white flex items-center justify-center font-bold text-xs">
          A1
        </div>
        <div>
          <span class="text-xs font-bold tracking-wider text-[#8c827a] uppercase block leading-none">EXAM PRACTICE PREVIEW</span>
          <span class="font-bold text-xs text-[#1f1d1a]">Goethe A1 Studio Trainer</span>
        </div>
        <span id="badge" class="px-2 py-0.5 rounded bg-[#f5f2eb] border border-[#e7e4dc] font-mono font-bold text-[#433428] text-xs">
          QUESTION 1 / 5
        </span>
      </div>
      <div class="flex items-center gap-2 sm:gap-3 text-xs font-mono text-[#8c827a]">
        <button onclick="toggleWidgetTheme()" id="wThemeBtn" title="Toggle Theme" class="px-2 py-0.5 rounded-lg border border-[#e7e4dc] bg-[#faf9f5] text-xs font-semibold text-[#1f1d1a] cursor-pointer">
          <span id="wThemeIcon">☀️</span> <span id="wThemeLabel" class="hidden sm:inline">Light</span>
        </button>
        <span>ACCURACY: <strong id="score" class="text-[#2d6a4f]">0</strong>/5</span>
        <span id="streak" class="text-[#b25e3b] font-bold">🔥 0</span>
      </div>
    </div>

    <!-- Question Prompt Card -->
    <div class="bg-white p-5 rounded-2xl border border-[#e7e4dc] shadow-[0_1px_3px_rgba(0,0,0,0.02)] space-y-3">
      <div class="flex items-center justify-between text-xs font-bold tracking-widest uppercase text-[#8c827a]">
        <span id="cat">A1 GRAMMAR · SIBILANT STEM TRAP</span>
        <span class="text-[#2d6a4f]">START DEUTSCH 1</span>
      </div>
      <h2 id="prompt" class="font-editorial text-2xl font-normal text-[#1f1d1a] leading-relaxed">
        Wie ___ du? — Ich heiße Thomas.
      </h2>
    </div>

    <!-- Options Grid (2x2 Architectural Cards) -->
    <div id="opts" class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
      <!-- Options injected by JS -->
    </div>

    <!-- Explanation Box (Appears on click) -->
    <div id="exp" class="hidden rounded-2xl border p-5 space-y-4 text-sm transition-all shadow-sm bg-white"></div>

    <!-- Footer Controls -->
    <div class="flex items-center justify-between pt-2 border-t border-[#e7e4dc] text-xs">
      <span class="text-xs font-mono text-[#8c827a]">Concise Syntax Breakdown &bull; Studio Mode</span>
      <button onclick="next()" id="btnNext" class="px-4 py-2 rounded-lg bg-[#433428] text-white hover:bg-[#32271e] font-semibold transition-colors shadow-sm flex items-center gap-1.5">
        <span>Next Question</span>
        <span>→</span>
      </button>
    </div>

  </div>

  <script>
    const questions = [
      {
        cat: "Grammar · Du-Form with stem ending in -ß",
        q: "Kennenlernen: 'Wie ___ du?' — 'Ich heiße Thomas.'",
        opts: ["heißt", "heißst", "heiße", "heißen"],
        ans: 0,
        full: "Kennenlernen: 'Wie heißt du?' — 'Ich heiße Thomas.'",
        trans: "Getting acquainted: 'What is your name?' — 'My name is Thomas.'",
        chips: [
          { de: "Wie", en: "how (Fragewort)" },
          { de: "heißt du", en: "are called (2. Person Sg.)" },
          { de: "Ich heiße", en: "I am called (1. Person Sg.)" },
          { de: "Thomas", en: "Name" }
        ],
        rule: "Verben mit Verbstamm auf <strong>-s, -ß, -z</strong> (z.B. <em>heißen</em>) erhalten in der 2. Person Singular (<em>du</em>) nur die Endung <strong>-t</strong> (NICHT <em>-st</em>!). Daher lauten <em>du heißt</em> und <em>er heißt</em> identisch.",
        tip: "Goethe A1 Sprechen Teil 1 (Sich vorstellen): Grundlegende Frage im Prüfungsgespräch."
      },
      {
        cat: "Prepositions · Geographic Origin",
        q: "Vorstellungsrunde: 'Woher kommen Sie?' — 'Ich komme ___ der Schweiz.'",
        opts: ["aus", "von", "in", "nach"],
        ans: 0,
        full: "Vorstellungsrunde: 'Woher kommen Sie?' — 'Ich komme aus der Schweiz.'",
        trans: "Introduction round: 'Where do you come from?' — 'I come from Switzerland.'",
        chips: [
          { de: "Woher", en: "where from" },
          { de: "kommen Sie", en: "do you come (Höflichkeitsform)" },
          { de: "aus", en: "from (Herkunft)" },
          { de: "der Schweiz", en: "Switzerland (Dativ feminin)" }
        ],
        rule: "<strong>'aus'</strong> bezeichnet die geografische Herkunft. Länder mit femininem Artikel (<em>die Schweiz</em>) stehen nach <em>aus</em> obligatorisch im Dativ: <strong>aus der Schweiz</strong>.",
        tip: "Goethe A1 Sprechen Teil 1: Standardfrage zur Herkunft."
      },
      {
        cat: "Grammar · Dative Verbs (helfen)",
        q: "Im Kaufhaus: 'Entschuldigung, können Sie ___ bitte helfen?'",
        opts: ["mir", "mich", "ich", "mein"],
        ans: 0,
        full: "Im Kaufhaus: 'Entschuldigung, können Sie mir bitte helfen?'",
        trans: "In the department store: 'Excuse me, can you please help me?'",
        chips: [
          { de: "Entschuldigung", en: "excuse me" },
          { de: "können Sie", en: "can you (Modalverb)" },
          { de: "mir", en: "me (Dativobjekt)" },
          { de: "bitte helfen", en: "please help (Infinitiv)" }
        ],
        rule: "Das Verb <strong>helfen</strong> regiert zwingend den <strong>Dativ</strong>. Das Personalpronomen der 1. Person Singular im Dativ lautet <strong>mir</strong> (nicht Akkusativ <em>mich</em>!).",
        tip: "Goethe A1 Sprechen Teil 3: Bitten und Anfragen formulieren mit Bildkarten."
      },
      {
        cat: "Grammar · Negation (nicht vs. kein)",
        q: "Am Frühstückstisch: 'Trinken Sie Tee?' — 'Nein, ich trinke ___ Tee.'",
        opts: ["keinen", "kein", "keine", "nicht"],
        ans: 0,
        full: "Am Frühstückstisch: 'Trinken Sie Tee?' — 'Nein, ich trinke keinen Tee.'",
        trans: "At the breakfast table: 'Do you drink tea?' — 'No, I drink no tea.'",
        chips: [
          { de: "Nein", en: "no" },
          { de: "ich trinke", en: "I drink (Subjekt + Verb)" },
          { de: "keinen Tee", en: "no tea (Akkusativ Maskulinum)" }
        ],
        rule: "Substantive mit unbestimmtem oder ohne Artikel werden mit <strong>kein-</strong> verneint. <em>Tee</em> ist maskulin (<em>der Tee</em>), im Akkusativ als direktes Objekt daher: <strong>keinen Tee</strong>.",
        tip: "Goethe A1 Sprechen Teil 2: Fragen zu Alltagsthemen (Essen & Trinken) beantworten."
      },
      {
        cat: "Grammar · Perfekt with 'sein'",
        q: "Unter Freunden: 'Wann ___ du gestern nach Hause ___?'",
        opts: ["bist ... gegangen", "hast ... gegangen", "bist ... gehen", "hast ... geht"],
        ans: 0,
        full: "Unter Freunden: 'Wann bist du gestern nach Hause gegangen?'",
        trans: "Among friends: 'When did you go home yesterday?'",
        chips: [
          { de: "Wann", en: "when (Zeitfrage)" },
          { de: "bist du", en: "did you (Hilfsverb sein)" },
          { de: "nach Hause", en: "home (Richtung)" },
          { de: "gegangen", en: "gone (Partizip II am Satzende)" }
        ],
        rule: "Verben der Ortsveränderung (<em>gehen, fahren, fliegen</em>) bilden das Perfekt obligatorisch mit dem Hilfsverb <strong>sein</strong> (<em>du bist</em>) und dem Partizip II am Satzende.",
        tip: "Goethe A1 Schreiben Teil 2: Kurze persönliche E-Mails über vergangene Erlebnisse verfassen."
      }
    ];

    let cur = 0;
    let score = 0;
    let streak = 0;
    let answered = false;

    function render() {
      answered = false;
      const q = questions[cur];
      document.getElementById('badge').innerText = `QUESTION ${cur + 1} / ${questions.length}`;
      document.getElementById('cat').innerText = q.cat;
      document.getElementById('prompt').innerText = q.q;

      const optsDiv = document.getElementById('opts');
      optsDiv.innerHTML = '';
      const letters = ['A', 'B', 'C', 'D'];

      q.opts.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.id = 'opt_' + i;
        btn.className = 'flex items-center gap-3 p-4 sm:p-5 rounded-2xl border-2 border-[#e7e4dc] bg-white hover:border-[#433428] hover:bg-[#faf9f5] text-left font-medium text-xs transition-all shadow-sm';
        btn.innerHTML = `<span class="w-7 h-7 rounded-lg text-xs bg-[#faf9f5] border border-[#e7e4dc] flex items-center justify-center font-bold text-xs text-[#736b63]">${letters[i]}</span><span class="text-[#1f1d1a]">${opt}</span>`;
        btn.onclick = () => choose(i);
        optsDiv.appendChild(btn);
      });

      const exp = document.getElementById('exp');
      exp.className = 'hidden rounded-2xl border p-5 space-y-4 text-sm transition-all shadow-sm bg-white';
      exp.innerHTML = '';
    }

    function choose(i) {
      if (answered) return;
      answered = true;
      const q = questions[cur];
      const correct = (i === q.ans);
      const chosenWord = q.opts[q.ans];

      if (correct) {
        score++;
        streak++;
      } else {
        streak = 0;
      }
      document.getElementById('score').innerText = score;
      document.getElementById('streak').innerText = '🔥 ' + streak;

      q.opts.forEach((_, idx) => {
        const btn = document.getElementById('opt_' + idx);
        if (idx === q.ans) {
          btn.className = 'flex items-center gap-3 p-3.5 rounded-xl border-2 border-[#2d6a4f] bg-[#edf4ed] font-bold text-xs shadow-sm';
        } else if (idx === i && !correct) {
          btn.className = 'flex items-center gap-3 p-3.5 rounded-xl border-2 border-[#b25e3b] bg-[#fbeee6] text-xs shadow-sm opacity-80';
        } else {
          btn.className = 'flex items-center gap-3 p-3.5 rounded-xl border border-[#e7e4dc] bg-[#faf9f5] text-xs opacity-40';
        }
      });

      const exp = document.getElementById('exp');
      exp.className = correct 
        ? 'rounded-2xl border-2 border-[#2d6a4f]/40 bg-white p-5 space-y-3 text-xs transition-all shadow-[0_2px_8px_rgba(45,106,79,0.06)]'
        : 'rounded-2xl border-2 border-[#b25e3b]/40 bg-white p-5 space-y-3 text-xs transition-all shadow-[0_2px_8px_rgba(178,94,59,0.06)]';

      let statusHtml = correct 
        ? `<div class="flex items-center justify-between pb-2 border-b border-[#f0ede6]">
             <div class="flex items-center gap-2">
               <span class="px-2.5 py-0.5 rounded-full bg-[#edf4ed] text-[#2d6a4f] font-bold text-xs border border-[#c3dfce]">✓ Richtig! (Correct)</span>
               <span class="text-[#524b45]">Your Answer: <strong class="px-1.5 py-0.5 rounded bg-[#433428] text-white font-mono text-xs">${chosenWord}</strong></span>
             </div>
             <span class="text-xs font-mono text-[#8c827a] uppercase">Goethe A1</span>
           </div>`
        : `<div class="flex items-center justify-between pb-2 border-b border-[#f0ede6]">
             <div class="flex items-center gap-2">
               <span class="px-2.5 py-0.5 rounded-full bg-[#fdf2ee] text-[#b25e3b] font-bold text-xs border border-[#f5d5c9]">✗ Leider falsch</span>
               <span class="text-[#524b45]">Correct Answer: <strong class="px-1.5 py-0.5 rounded bg-[#2d6a4f] text-white font-mono text-xs">${chosenWord}</strong></span>
             </div>
             <span class="text-xs font-mono text-[#b25e3b] uppercase">Korrektur</span>
           </div>`;

      let chipsHtml = `
        <div class="space-y-1.5 pt-1">
          <div class="text-xs font-bold uppercase tracking-widest text-[#8c827a] flex items-center gap-1.5">
            <span>🧩</span> Sentence Structure & Breakdown
          </div>
          <div class="flex flex-wrap gap-1.5">
            ${q.chips.map(c => `
              <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-[#faf9f5] border border-[#e7e4dc] text-xs">
                <span class="font-bold text-[#1f1d1a] font-mono">${c.de}</span>
                <span class="text-xs text-[#736b63] border-l border-[#e7e4dc] pl-1.5">${c.en}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;

      let contentHtml = `
        ${statusHtml}
        <div class="p-3.5 rounded-xl bg-[#faf9f5] border border-[#e7e4dc] space-y-1">
          <div class="text-xs font-bold uppercase tracking-widest text-[#8c827a]">Target Sentence</div>
          <div class="font-editorial text-lg text-[#1f1d1a] leading-snug">${q.full}</div>
          <div class="text-xs text-[#736b63] italic pt-0.5">"${q.trans}"</div>
        </div>

        ${chipsHtml}

        <div class="p-3 rounded-xl bg-[#faf9f5] border border-[#e7e4dc] space-y-1 text-xs">
          <div class="text-xs font-bold uppercase tracking-widest text-[#433428] flex items-center gap-1.5">
            <span>💡</span> Grammar Rule
          </div>
          <p class="text-[#3d3833] leading-relaxed text-xs">${q.rule}</p>
        </div>

        <div class="flex items-start gap-2.5 p-2.5 rounded-xl bg-[#edf4ed] border border-[#d8e7d8] text-xs text-[#2d6a4f]">
          <span class="text-sm">🎯</span>
          <div class="leading-snug">
            <strong class="font-bold text-xs uppercase tracking-wider block text-[#2d6a4f]">Goethe A1 Exam Tip:</strong>
            <span class="text-xs text-[#24523d]">${q.tip}</span>
          </div>
        </div>
      `;

      exp.innerHTML = contentHtml;
      exp.classList.remove('hidden');
    }

    function next() {
      if (cur < questions.length - 1) {
        cur++;
        
    function toggleWidgetTheme() {
      const isDark = document.body.classList.toggle('dark');
      const icon = document.getElementById('wThemeIcon');
      const label = document.getElementById('wThemeLabel');
      if (icon) icon.innerText = isDark ? '☀️' : '🌙';
      if (label) label.innerText = isDark ? 'Light' : 'Dark';
    }

    render();
      } else {
        cur = 0;
        
    function toggleWidgetTheme() {
      const isDark = document.body.classList.toggle('dark');
      const icon = document.getElementById('wThemeIcon');
      const label = document.getElementById('wThemeLabel');
      if (icon) icon.innerText = isDark ? '☀️' : '🌙';
      if (label) label.innerText = isDark ? 'Light' : 'Dark';
    }

    render();
      }
    }

    
    function toggleWidgetTheme() {
      const isDark = document.body.classList.toggle('dark');
      const icon = document.getElementById('wThemeIcon');
      const label = document.getElementById('wThemeLabel');
      if (icon) icon.innerText = isDark ? '☀️' : '🌙';
      if (label) label.innerText = isDark ? 'Light' : 'Dark';
    }

    render();
  </script>
</body>
</html>
